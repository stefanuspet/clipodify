# Metadata SFX. Gemini memilih `tag`; kode memilih file dengan tag itu.
# File baru di folder ini tanpa entri di sini tetap bisa dipakai lewat tag = nama file.

sfx_pop:       {name: Pop,       tag: pop,       use: "penekanan ringan, punchline kecil, kata highlight", intensity: low,  source: bawaan}
